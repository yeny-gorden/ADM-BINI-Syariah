<!DOCTYPE html>
<html lang="id">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login Admin - BINI SYARIAH</title>
</head>

<body>
 <div class="box">
  <form id="loginForm">
   <h2>ADMIN LOGIN</h2>
   <div class="input-box">
    <input type="text" id="username" required>
    <span>Username</span>
    <i></i>
   </div>
   <div class="input-box">
    <input type="password" id="password" required>
    <span>Password</span>
    <i></i>
   </div>
   <div id="status-msg"></div>
   <button type="submit" id="loginBtn" class="submit-btn">MASUK</button>
  </form>
 </div>
</body>

<style>* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0d0d12; }
        .box { position: relative; width: 380px; height: 430px; background: #16161d; border-radius: 12px; overflow: hidden; box-shadow: 0 0 25px rgba(0, 243, 255, 0.15); }
        .box::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 380px; height: 430px;
            background: linear-gradient(0deg, transparent, transparent, #00f3ff, #00f3ff, #00f3ff);
            z-index: 1; transform-origin: bottom right; animation: animateBorder 6s linear infinite;
        }
        .box::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 380px; height: 430px;
            background: linear-gradient(0deg, transparent, transparent, #ff007f, #ff007f, #ff007f);
            z-index: 1; transform-origin: bottom right; animation: animateBorder 6s linear infinite; animation-delay: -3s;
        }
        @keyframes animateBorder { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .box form { position: absolute; inset: 4px; background: #14141a; padding: 40px; border-radius: 10px; z-index: 2; display: flex; flex-direction: column; }
        .box form h2 { color: #fff; font-weight: 600; text-align: center; letter-spacing: 0.1em; text-shadow: 0 0 10px rgba(0, 243, 255, 0.6); }
        .input-box { position: relative; width: 100%; margin-top: 32px; }
        .input-box input { position: relative; width: 100%; padding: 20px 10px 10px; background: transparent; outline: none; border: none; color: #fff; font-size: 1em; letter-spacing: 0.05em; transition: 0.5s; z-index: 10; }
        .input-box span { position: absolute; left: 0; padding: 20px 0px 10px; pointer-events: none; color: #8f8f8f; font-size: 1em; transition: 0.5s; }
        .input-box input:valid ~ span, .input-box input:focus ~ span { color: #00f3ff; font-size: 0.75em; transform: translateY(-34px); }
        .input-box i { position: absolute; left: 0; bottom: 0; width: 100%; height: 2px; background: #00f3ff; border-radius: 4px; transition: 0.5s; pointer-events: none; box-shadow: 0 0 8px #00f3ff; }
        .input-box input:valid ~ i, .input-box input:focus ~ i { height: 44px; }
        #status-msg { margin-top: 16px; font-size: 0.85em; text-align: center; min-height: 20px; font-weight: 500; }
        .submit-btn { border: 2px solid #00f3ff; outline: none; padding: 12px 25px; background: transparent; color: #00f3ff; cursor: pointer; font-size: 1em; border-radius: 6px; font-weight: 600; letter-spacing: 0.1em; margin-top: 24px; transition: 0.3s; }
        .submit-btn:hover { background: #00f3ff; color: #14141a; box-shadow: 0 0 15px #00f3ff, 0 0 35px #00f3ff; }
/* Menyembunyikan badge atau watermark Netlify */
.netlify-badge, 
a[href*="netlify.com/?utm_source"],
iframe#netlify-badge-iframe {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
}
</style><script>// GANTI DENGAN URL DEPLOYMENT APPS SCRIPT ANDA YANG SAMA DENGAN ADMIN.HTML
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwu0kGhiGxqD1wH5MeqWxIDMfep_SsTLYkpYMnjwzGJNu2kUPAW8T83SL2C1t52CH9r/exec";

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('status-msg');
            const loginBtn = document.getElementById('loginBtn');

            statusMsg.style.color = "#00f3ff";
            statusMsg.textContent = "Memverifikasi ke Google Sheets...";
            loginBtn.disabled = true;

            try {
                // Mengirim request POST dengan format JSON standar Apps Script Web App
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'loginAdmin', username, password })
                });
                const result = await res.json();

                if (result.status === 'success') {
                    // Simpan sesi login dan nama teller agar admin.html tahu bahwa admin sudah login
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('tellerName', result.tellerName || 'Admin Teller');
                    
                    statusMsg.textContent = "Login berhasil! Membuka dashboard...";
                    setTimeout(() => { 
                        window.location.href = "admin.html"; 
                    }, 700);
                } else {
                    statusMsg.style.color = "#ff007f";
                    statusMsg.textContent = result.message || "Username atau Password salah!";
                    loginBtn.disabled = false;
                }
            } catch (err) {
                statusMsg.style.color = "#ff007f";
                statusMsg.textContent = "Gagal terhubung ke Google Sheets. Periksa URL Script.";
                loginBtn.disabled = false;
            }
        });</script></html>
