<!DOCTYPE html>
<html lang="id" class="dark">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login Administrator - BINI Syariah</title>

 <!-- KONFIGURASI PWA -->
 <link rel="manifest" href="./manifest.json">
 <meta name="theme-color" content="#020617">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
 <link rel="apple-touch-icon" href="./icon-192.png">

 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-orange-500 selection:text-white flex items-center justify-center min-h-screen px-4">
 
 <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/90 space-y-6 relative overflow-hidden">
  
  <!-- Header Logo & Title -->
  <div class="text-center space-y-2">
   <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white font-extrabold text-2xl tracking-tighter shadow-lg shadow-orange-500/30 border border-orange-400/40 mx-auto">
    69
   </div>
   <div>
    <h1 class="text-base font-extrabold tracking-tight text-white">BINI <span class="text-orange-400">Syariah</span></h1>
    <span class="text-[10px] text-orange-300 font-semibold tracking-wider block uppercase mt-0.5">Portal Otoritas Administrator</span>
   </div>
  </div>

  <!-- Form Login Admin -->
  <form onsubmit="handleAdminLogin(event)" class="space-y-4">
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username Admin</label>
    <div class="flex items-center bg-slate-950 border border-slate-700/80 focus-within:border-orange-500 rounded-xl px-3.5">
     <i class="fa-solid fa-user-shield text-slate-500 text-xs mr-2.5"></i>
     <input type="text" id="adminUsername" required placeholder="admin" class="w-full bg-transparent py-3 text-xs text-white focus:outline-none">
    </div>
   </div>

   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password / PIN</label>
    <div class="flex items-center bg-slate-950 border border-slate-700/80 focus-within:border-orange-500 rounded-xl px-3.5">
     <i class="fa-solid fa-lock text-slate-500 text-xs mr-2.5"></i>
     <input type="password" id="adminPassword" required placeholder="••••••" class="w-full bg-transparent py-3 text-xs text-white focus:outline-none">
    </div>
   </div>

   <button type="submit" id="btnLoginAdmin" class="w-full py-3.5 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs transition shadow-lg shadow-orange-600/30 active:scale-95">
    Masuk Panel Admin
   </button>
  </form>

  <div class="text-center pt-2 border-t border-slate-800/80">
   <p class="text-[10px] text-slate-500">Sistem Perbankan Terisolasi & Terenkripsi</p>
  </div>
 </div>

 <!-- Toast Notification Container -->
 <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm pointer-events-none space-y-2"></div>

 <style>
  body { font-family: 'Inter', sans-serif; background-color: #020617; }
 </style>

 <script>
  // PWA Service Worker Registration
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwu0kGhiGxqD1wH5MeqWxIDMfep_SsTLYkpYMnjwzGJNu2kUPAW8T83SL2C1t52CH9r/exec";

  async function handleAdminLogin(e) {
   e.preventDefault();
   const usernameInput = document.getElementById('adminUsername').value.trim();
   const passwordInput = document.getElementById('adminPassword').value.trim();
   const btn = document.getElementById('btnLoginAdmin');

   btn.disabled = true;
   btn.textContent = 'Memeriksa Otoritas...';

   try {
    const response = await fetch(SCRIPT_URL, {
     method: 'POST',
     body: JSON.stringify({
      action: 'loginAdmin',
      data: { username: usernameInput, password: passwordInput }
     })
    });
    const result = await response.json();

    if (result.status === 'success') {
     sessionStorage.setItem('nusa_admin_session', JSON.stringify(result.admin));
     showToast('Login berhasil! Mengalihkan ke dashboard...', 'success');
     setTimeout(() => {
      window.location.href = 'admin.html';
     }, 800);
    } else {
     showToast(result.message || 'Username atau Password salah!', 'error');
     btn.disabled = false;
     btn.textContent = 'Masuk Panel Admin';
    }
   } catch (err) {
    showToast('Gagal terhubung ke server backend.', 'error');
    btn.disabled = false;
    btn.textContent = 'Masuk Panel Admin';
   }
  }

  function showToast(message, type = 'info') {
   const container = document.getElementById('toastContainer');
   const toast = document.createElement('div');
   const colors = { success: 'border-orange-500 text-orange-300', error: 'border-rose-500 text-rose-300', info: 'border-sky-500 text-sky-300' };
   toast.className = `bg-slate-900 border ${colors[type]} px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-2.5 text-xs font-medium`;
   toast.innerHTML = `<i class="fa-solid fa-circle-info"></i><span>${message}</span>`;
   container.appendChild(toast);
   setTimeout(() => toast.remove(), 3000);
  }
 </script>
</html>
