<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - BINI Syariah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Konfigurasi PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans px-4 py-8">
  <div class="max-w-md w-full mx-auto space-y-6 my-auto">
    <div class="text-center space-y-3">
      <div class="w-20 h-20 bg-orange-500/20 text-orange-400 rounded-3xl flex items-center justify-center mx-auto text-3xl border-2 border-orange-500/40 shadow-xl">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">LOGIN ADMIN / TELLER</h1>
      <p class="text-sm text-orange-300 font-medium">Sistem Keuangan Resmi BINI Syariah</p>
    </div>

    <form onsubmit="handleAdminLogin(event)" class="space-y-4 bg-slate-900 border-2 border-slate-800 p-6 rounded-3xl shadow-2xl">
      <div>
        <label class="block text-sm font-bold text-slate-200 mb-2">ID Admin atau Nama</label>
        <input type="text" id="adminUser" required placeholder="Contoh: ADM-01" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-orange-500 rounded-2xl px-4 py-3.5 text-sm text-white focus:outline-none uppercase font-mono">
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-200 mb-2">PIN Admin</label>
        <input type="password" id="adminPin" required placeholder="••••••" class="w-full bg-slate-950 border-2 border-slate-700 focus:border-orange-500 rounded-2xl px-4 py-3.5 text-base text-white tracking-[0.5em] text-center font-bold focus:outline-none">
      </div>
      <div id="loginStatus" class="text-xs text-center font-bold min-h-[20px]"></div>
      <button type="submit" id="btnLogin" class="w-full py-4 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-black text-base shadow-xl shadow-orange-600/30 transition">
        Masuk Panel Admin
      </button>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5jTLvsc9nKsVikolWzQk1n9mUCFKNOCu0Evzwt4R3gN5528jVPEiwU2JyrmjTs2xd/exec";

    async function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value.trim();
      const pin = document.getElementById('adminPin').value.trim();
      const statusEl = document.getElementById('loginStatus');
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';
      statusEl.textContent = '';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'loginAdmin', data: { user, pin } })
        });
        const result = await res.json();
        if (result.status === 'success') {
          localStorage.setItem('currentAdmin', JSON.stringify(result.admin));
          window.location.href = 'admin.html';
        } else {
          statusEl.textContent = result.message || 'ID atau PIN Admin salah!';
          statusEl.className = 'text-xs text-center text-red-400 font-bold';
        }
      } catch(err) {
        statusEl.textContent = 'Gagal terhubung ke jaringan.';
        statusEl.className = 'text-xs text-center text-red-400 font-bold';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk Panel Admin';
      }
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then((reg) => {
            console.log('Service Worker terdaftar dengan sukses:', reg.scope);
          })
          .catch((err) => {
            console.log('Pendaftaran Service Worker gagal:', err);
          });
      });
    }
  </script>
</body>
</html>
