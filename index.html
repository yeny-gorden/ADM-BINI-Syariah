<!DOCTYPE html>
<html lang="id" class="dark">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Login Administrator - BINI Syariah</title>

 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex items-center justify-center p-4">
 <div class="w-full max-w-md bg-slate-900 border border-orange-500/40 rounded-3xl p-7 shadow-2xl relative overflow-hidden animate-card">
  
  <!-- Header Admin Login -->
  <div class="text-center mb-6">
   <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white font-extrabold text-2xl mx-auto mb-3 shadow-lg shadow-emerald-500/30 border border-emerald-400/40">
    <i class="fa-solid fa-shield-halved"></i>
   </div>
   <h1 class="text-base font-extrabold text-white tracking-tight">PORTAL ADMINISTRATOR</h1>
   <p class="text-[11px] text-emerald-400 font-semibold tracking-wider mt-0.5 uppercase">Otorisasi Teller & Pengelola Sistem</p>
  </div>

  <!-- Form Login Admin -->
  <form onsubmit="handleAdminLogin(event)" class="space-y-4">
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">ID / Nama Teller / Admin</label>
    <div class="flex items-center bg-slate-950 border border-slate-700 focus-within:border-orange-500 rounded-xl px-3.5">
     <input type="text" id="adminUser" required placeholder="Contoh: ADMIN-01 atau Teller Budi" class="w-full bg-transparent py-3 text-xs text-white font-mono focus:outline-none">
    </div>
   </div>
   <div>
    <label class="block text-xs font-semibold text-slate-300 mb-1.5">PIN / Password Keamanan Admin</label>
    <input type="password" id="adminPass" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 focus:border-orange-500 rounded-xl px-3.5 py-3 text-xs text-white text-center font-bold tracking-[0.4em] focus:outline-none">
   </div>
   
   <div id="adminLoginStatus" class="text-[11px] text-center font-medium min-h-[16px]"></div>

   <button type="submit" id="adminLoginBtn" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-lg shadow-emerald-600/30 transition">
    Masuk ke Panel Admin
   </button>
  </form>

 </div>
</body>

<style>
  body { font-family: 'Inter', sans-serif; background-color: #020617; }
  @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .animate-card { animation: fadeSlideUp 0.4s ease-out forwards; }
</style>

<script>
  function handleAdminLogin(e) {
    e.preventDefault();
    const user = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value.trim();
    const status = document.getElementById('adminLoginStatus');
    const btn = document.getElementById('adminLoginBtn');

    status.style.color = "#f97316";
    status.textContent = "Memverifikasi kredensial teller...";
    btn.disabled = true;

    // PIN / Password Master Admin (Bisa Anda sesuaikan di sini)
    const MASTER_ADMIN_PIN = "696969"; 

    setTimeout(() => {
      if (pass === MASTER_ADMIN_PIN && user.length > 0) {
        // Simpan sesi admin beserta nama tellernya agar tercatat siapa yang melayani
        sessionStorage.setItem('nusa_admin_session', user);
        status.style.color = "#34d399";
        status.textContent = `Otorisasi diterima, ${user}! Membuka panel...`;
        setTimeout(() => { window.location.href = "admin.html"; }, 800);
      } else {
        status.style.color = "#fb7185";
        status.textContent = "PIN Keamanan Admin Salah!";
        btn.disabled = false;
      }
    }, 600);
  }
</script>
</html>
